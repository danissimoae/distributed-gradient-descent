apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: gradient-descent
  labels:
    app: worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
      - name: worker
        image: gradient-descent-worker:latest
        imagePullPolicy: Never
        env:
        - name: COORDINATOR_URL
          value: "http://coordinator:5000"
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
