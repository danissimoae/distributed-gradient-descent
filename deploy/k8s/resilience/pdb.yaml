apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: worker-pdb
  namespace: gradient-descent
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: worker
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: coordinator-pdb
  namespace: gradient-descent
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: coordinator
